<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habitly â€“ Habit Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="js/theme-init.js"></script>
<script src="js/tailwind.js"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
<div class="mx-auto max-w-5xl px-4 sm:px-6 py-6 sm:py-10">

  <header class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Habitly</h1>
      <p id="todayLabel" class="text-sm text-slate-500 dark:text-slate-400 mt-0.5"></p>
    </div>
    <div class="flex items-center gap-2">
      <button id="btnData" class="inline-flex items-center gap-2 h-10 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Export or import your data">
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        <span class="hidden sm:inline">Backup</span>
      </button>
      <button id="btnTheme" class="h-10 w-10 grid place-items-center rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 transition" aria-label="Toggle dark mode">
        <svg class="w-5 h-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <svg class="w-5 h-5 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="btnAdd" class="inline-flex items-center gap-2 h-10 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-sm transition">
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add habit
      </button>
    </div>
  </header>

  <section class="mt-6 rounded-2xl bg-indigo-600 dark:bg-indigo-500/15 dark:border dark:border-indigo-400/20 text-white p-5 sm:p-6 shadow-lg shadow-indigo-600/10">
    <div class="flex items-end justify-between gap-4">
      <div>
        <p class="text-indigo-100 dark:text-indigo-200 text-sm font-medium">Today's progress</p>
        <p id="todaySub" class="mt-1 text-lg sm:text-xl font-semibold"></p>
      </div>
      <p id="todayPct" data-v="0" class="text-5xl sm:text-6xl font-bold tabular-nums leading-none">0%</p>
    </div>
    <div class="mt-5 h-3 rounded-full bg-white/25 overflow-hidden" role="progressbar" aria-label="Today's completion" aria-valuemin="0" aria-valuemax="100" id="overallTrack">
      <div id="overallBar" class="bar h-full rounded-full bg-white" style="width:0%"></div>
    </div>
    <dl class="mt-5 grid grid-cols-3 gap-3 text-sm">
      <div><dt class="text-indigo-100 dark:text-indigo-200">Best streak</dt><dd id="statStreak" class="text-lg font-semibold mt-0.5">â€“</dd></div>
      <div><dt class="text-indigo-100 dark:text-indigo-200">This week</dt><dd id="statWeek" class="text-lg font-semibold mt-0.5">â€“</dd></div>
      <div><dt class="text-indigo-100 dark:text-indigo-200">Habits</dt><dd id="statTotal" class="text-lg font-semibold mt-0.5">â€“</dd></div>
    </dl>
  </section>

  <section class="mt-6 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
    <div id="catChips" class="flex flex-wrap gap-2" aria-label="Filter by category"></div>
    <div class="flex flex-wrap gap-3">
      <div id="statusSeg" class="inline-flex p-1 rounded-xl bg-slate-200/70 dark:bg-slate-800 text-sm font-medium" role="group" aria-label="Filter by status">
        <button data-status="all" class="px-3 py-1.5 rounded-lg transition">All</button>
        <button data-status="active" class="px-3 py-1.5 rounded-lg transition">Active</button>
        <button data-status="completed" class="px-3 py-1.5 rounded-lg transition">Completed today</button>
      </div>
      <div id="periodSeg" class="inline-flex p-1 rounded-xl bg-slate-200/70 dark:bg-slate-800 text-sm font-medium" role="group" aria-label="Progress period">
        <button data-period="week" class="px-3 py-1.5 rounded-lg transition">Week</button>
        <button data-period="month" class="px-3 py-1.5 rounded-lg transition">Month</button>
      </div>
    </div>
  </section>

  <main id="list" class="mt-5 grid grid-cols-1 lg:grid-cols-2 gap-4"></main>
</div>

<!-- Habit modal -->
<div id="habitModal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-900/60 sm:p-4" role="dialog" aria-modal="true" aria-labelledby="habitTitle">
  <form id="habitForm" novalidate class="rise w-full sm:max-w-md bg-white dark:bg-slate-900 rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[92vh] overflow-y-auto p-5 sm:p-6 border border-slate-200 dark:border-slate-800">
    <h2 id="habitTitle" class="text-lg font-semibold">New habit</h2>
    <label class="block mt-4 text-sm font-medium" for="fName">Habit name</label>
    <input id="fName" maxlength="60" autocomplete="off" placeholder="e.g. Stretch for 10 minutes" class="mt-1.5 w-full h-11 px-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30">
    <label class="block mt-4 text-sm font-medium" for="fCat">Category</label>
    <select id="fCat" class="mt-1.5 w-full h-11 px-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30"></select>
    <div class="mt-4 flex items-center justify-between">
      <span class="text-sm font-medium">Target days</span>
      <button type="button" id="fDaily" class="px-3 py-1 rounded-lg text-xs font-semibold border transition">Daily</button>
    </div>
    <div id="fDays" class="mt-2 grid grid-cols-7 gap-1.5"></div>
    <p class="mt-4 text-sm font-medium">Color accent</p>
    <div id="fColors" class="mt-2 flex flex-wrap items-center gap-2"></div>
    <p id="fError" class="mt-4 text-sm text-rose-600 dark:text-rose-400 hidden" role="alert"></p>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" data-close class="h-10 px-4 rounded-xl text-sm font-medium border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Cancel</button>
      <button type="submit" id="fSave" class="h-10 px-5 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition">Save habit</button>
    </div>
  </form>
</div>

<!-- Data modal -->
<div id="dataModal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-900/60 sm:p-4" role="dialog" aria-modal="true" aria-labelledby="dataTitle">
  <div class="rise w-full sm:max-w-lg bg-white dark:bg-slate-900 rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[92vh] overflow-y-auto p-5 sm:p-6 border border-slate-200 dark:border-slate-800">
    <h2 id="dataTitle" class="text-lg font-semibold">Back up or restore</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Copy or download this JSON to back up your habits and history. To restore, paste a backup below or choose a file, then select Import.</p>
    <textarea id="dataText" spellcheck="false" class="mt-4 w-full h-48 p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 font-mono text-xs focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30"></textarea>
    <div class="mt-4 flex flex-wrap gap-2">
      <button id="dCopy" class="h-10 px-4 rounded-xl text-sm font-medium border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Copy</button>
      <button id="dDownload" class="h-10 px-4 rounded-xl text-sm font-medium border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Download .json</button>
      <button id="dFile" class="h-10 px-4 rounded-xl text-sm font-medium border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Choose file</button>
      <input id="dFileInput" type="file" accept=".json,application/json" class="hidden">
      <button id="dImport" class="h-10 px-4 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition sm:ml-auto">Import</button>
    </div>
    <div class="mt-4 text-right"><button data-close class="h-10 px-4 rounded-xl text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition">Close</button></div>
  </div>
</div>

<!-- Confirm modal -->
<div id="confirmModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-900/60 p-4" role="alertdialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="rise w-full max-w-sm bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-6 border border-slate-200 dark:border-slate-800">
    <h2 id="cTitle" class="text-lg font-semibold"></h2>
    <p id="cMsg" class="mt-2 text-sm text-slate-600 dark:text-slate-400"></p>
    <div class="mt-6 flex justify-end gap-2">
      <button data-close class="h-10 px-4 rounded-xl text-sm font-medium border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Cancel</button>
      <button id="cOk" class="h-10 px-4 rounded-xl text-sm font-semibold bg-rose-600 hover:bg-rose-500 text-white transition"></button>
    </div>
  </div>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[70] hidden px-4 py-2.5 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-medium shadow-xl max-w-[90vw]" role="status"></div>

<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
